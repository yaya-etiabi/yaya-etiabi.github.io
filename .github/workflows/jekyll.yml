name: Deploy Astro research website to Pages

on:
  push:
    branches: ["master"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Replaces the Jekyll deployment at cutover; never run a second Pages deploy.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    # Merging the approved release PR into the organization master activates deployment.
    # This explicit guard also prevents publishing the production build from the fork.
    if: github.repository == 'yaya-etiabi/yaya-etiabi.github.io' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site-v2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: site-v2/package-lock.json
      - name: Install verified dependencies
        run: npm ci --no-audit --no-fund
      - name: Build and validate canonical website
        env:
          SITE_URL: https://yaya-etiabi.github.io
          BASE_PATH: /
        run: |
          npm run build
          npm run test:links
          npm run test:seo
          test -f dist/index.html
          test -f dist/sitemap.xml
          if grep -q 'noindex,nofollow' dist/index.html; then
            echo "Refusing to publish a noindex preview build" >&2
            exit 1
          fi
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload static Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site-v2/dist

  deploy:
    if: github.repository == 'yaya-etiabi/yaya-etiabi.github.io' && github.ref == 'refs/heads/master'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy verified Astro files
        id: deployment
        uses: actions/deploy-pages@v4
